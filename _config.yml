# Hexo 站点配置
title: Chronicle
subtitle: AI 日报与思考
description: 每天记录 AI 圈发生了什么
author: wolkasem
language: zh-CN
timezone: Asia/Shanghai

# 站点 URL。使用自定义域名 blog.wolkasem.cn
# 注意:换成自定义域名后 root 必须为 /,
# 否则静态资源与文章链接会带上 /chronicle 前缀而全部 404
url: https://blog.wolkasem.cn
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
  lang: zh-CN

# 仓库信息(部分插件会用到)
repo: yaorenyi/chronicle
branch: main

# 部署
deploy:
  type: git
  repo: https://github.com/yaorenyi/chronicle.git
  branch: main

# 输出
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - node_modules/**
  - README.md

# 文章摘要显示字数
summary_line_length: 80
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Markdown 渲染
markdown:
  render:
    html: false
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: false
  anchor:
    enable: true
    min_depth: 2
    max_depth: 4

pretty_urls:
  trailing_index: false
  trailing_html: true

# 主题
theme: async

# 插件
plugins:
  - hexo-generator-archive
  - hexo-generator-category
  - hexo-generator-index
  - hexo-generator-tag

# 日报相关(自定义，供 sync_daily.py 与模板使用)
daily:
  # 归档页展示的最大期数
  archive_limit: 60
